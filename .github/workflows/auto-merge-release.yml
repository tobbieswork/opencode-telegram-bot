name: Auto-merge release

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

# Release-please PRs are created by the github-actions app. GitHub blocks
# `pull_request`-triggered workflows on app-created PRs pending maintainer
# approval, so the release pipeline runs on `pull_request_target` instead
# (base-branch context — never subject to that approval gate).
#
# SECURITY: pull_request_target runs with base-branch trust and this workflow
# checks out the PR head. That is only safe because BOTH jobs are hard-gated
# to release-please's own PRs (actor + head-ref prefix) — a metadata-only
# version bump generated from main, never arbitrary user code. Human PRs keep
# their normal ci.yml pipeline.
jobs:
  Typecheck:
    # Reports the required "Typecheck" check for release PRs (ci.yml skips
    # them, so there is no conflicting check with the same context).
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  merge:
    needs: Typecheck
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # pull_request_target jobs have NO default workspace checkout — the
      # directory is empty, and `gh pr merge` needs a git repo to resolve the
      # current repository. Check out the BASE branch (the pull_request_target
      # security model: never the PR's code).
      - uses: actions/checkout@v4
      - name: Merge release PR (owner token, admin merge)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          # Branch protection on main requires 1 approving review; the PR's
          # author is the github-actions app, which cannot approve its own PR
          # and is not an admin. So merge with the owner's token using
          # --admin (verified 2026-10-28: a plain owner merge is still
          # rejected by the policy, but admin=true bypasses it).
          # `needs: Typecheck` above means the PR only merges green.
          gh pr merge "${{ github.event.pull_request.number }}" --squash --admin
      # release-please 17.3.0 tags this repo's releases as
      # <component>-v<version> (the config tag-template is not honored
      # empirically — v1.1.0 and v1.2.0 both landed with the prefix). This
      # step normalizes to the v-prefixed name used by v1.0.0 and expected
      # by `git describe` in /status: creates v<version> on the same commit,
      # repoints the GitHub Release, deletes the prefixed tag.
      - name: Normalize tag to v<version>
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e
          git fetch origin main --tags --quiet
          V=$(git show origin/main:package.json | node -pe "JSON.parse(require('fs').readFileSync(0)).version")
          echo "Releasing v$V"
          if git ls-remote --exit-code --tags origin "v$V" >/dev/null 2>&1; then
            echo "v$V already exists, nothing to do"; exit 0
          fi
          # Wait for release-please to publish the release (it tags +
          # creates the GitHub Release a few seconds after the merge).
          RID=""
          for i in $(seq 1 24); do
            RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/opencode-telegram-bot-v$V" -q .id 2>/dev/null || true)
            [ -n "$RID" ] && break
            sleep 5
          done
          if [ -z "$RID" ]; then
            echo "WARN: GitHub release for opencode-telegram-bot-v$V not found, skipping"
            exit 0
          fi
          SHA=$(git rev-parse "opencode-telegram-bot-v$V^{commit}")
          git tag -f "v$V" "$SHA"
          git push origin "v$V"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" -f tag_name="v$V" >/dev/null
          git push origin --delete "opencode-telegram-bot-v$V"
          echo "Normalized tag to v$V"
