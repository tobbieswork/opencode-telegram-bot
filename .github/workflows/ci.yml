name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Release-please PRs (github-actions app, release-please--* refs) are skipped
  # here: app-created PRs get pull_request workflows blocked pending manual
  # approval, and their required "Typecheck" check is reported by
  # auto-merge-release.yml instead.
  typecheck:
    name: Typecheck
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    needs: typecheck
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
