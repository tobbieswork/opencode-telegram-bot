name: Release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Bootstrap guard: the very first release (v1.0.0) is tagged manually.
      # Until a v1.* tag exists this job is a no-op, so the initial push of
      # this workflow can't race the manual tag or emit a stray release.
      # (Checked via API, not `git ls-remote origin` — runners have no
      # `origin` remote, and the API avoids unauthenticated rate limits.)
      - name: Check for existing releases
        id: has-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
              | grep -Eq '"name": *"v1\.'; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release-please
        if: steps.has-releases.outputs.has == 'true'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # GitHub suppresses `opened` pull events for PRs created by the
  # github-actions app (they sit in action_required), so the auto-merge
  # workflow can't rely on the `opened` event. A push to the release branch
  # (`synchronize`) DOES fire it — this job pushes a no-op commit right after
  # release-please creates (or updates) the release PR.
  #
  # The no-op MUST be pushed with a NON-APP identity (the owner's PAT):
  # pushes made by the same app that created the PR (github-actions[bot]
  # via GITHUB_TOKEN) are suppressed the same way — no `synchronize` event
  # is emitted at all (observed live 2026-10-29 on the v1.2.2 release PR,
  # while the identical push from a git client on a different identity did
  # fire the event). With the owner PAT the event actor is the human owner,
  # which always fires `pull_request_target`.
  trigger-auto-merge:
    needs: release-please
    if: ${{ always() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: Fire synchronize on the release PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open' });
            const pr = prs.find(p => p.user.login === 'github-actions[bot]' && p.head.ref.startsWith('release-please--'));
            if (!pr) { core.info('No open release PR — nothing to do'); return; }
            core.info('Firing synchronize on release PR #' + pr.number);
            const { data: head } = await github.rest.git.getCommit({ owner, repo, commit_sha: pr.head.sha });
            const { data: bump } = await github.rest.git.createCommit({
              owner, repo,
              message: 'chore: fire release auto-merge (synchronize)',
              tree: head.tree.sha,
              parents: [pr.head.sha],
            });
            // Update the branch ref through a raw API call authenticated as
            // the owner (see job comment — must not be the creating app).
            // The {ref} path param must be `heads/<branch>` — WITHOUT the
            // refs/ prefix (GitHub builds the full ref itself; sending
            // refs/heads/<branch> makes it look up refs/refs/heads/<branch>
            // → 422 "Reference does not exist"). Verified live 2026-10-28.
            const res = await fetch(
              `https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${pr.head.ref}`,
              {
                method: 'PATCH',
                headers: {
                  Authorization: `Bearer ${process.env.RELEASE_PAT}`,
                  'Content-Type': 'application/json',
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
                body: JSON.stringify({ sha: bump.sha }),
              },
            );
            if (!res.ok) {
              throw new Error(`updateRef failed: ${res.status} ${await res.text()}`);
            }
            core.info('Ref now at ' + pr.head.ref + ' → ' + bump.sha);
