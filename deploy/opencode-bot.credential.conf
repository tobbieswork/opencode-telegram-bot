# OPTIONAL drop-in: load the Telegram bot token as a systemd credential
# instead of a plaintext TELEGRAM_BOT_TOKEN in .env.
#
# Why: a credential is a file only this service can read. It is NOT an
# environment variable, so the OpenCode service (and the agents it runs) that
# the bot starts can't see it with `printenv`, and it is never in the repo.
#
# Kept as a drop-in, not in the base unit, on purpose: a missing credential
# file makes the unit fail to start, so installs that haven't created it yet
# keep working until they opt in.
#
# Install (after creating the credential file, see README "Keeping the bot
# token out of .env"):
#   mkdir -p ~/.config/systemd/user/opencode-bot.service.d
#   cp deploy/opencode-bot.credential.conf \
#      ~/.config/systemd/user/opencode-bot.service.d/credential.conf
#   systemctl --user daemon-reload
#   systemctl --user restart opencode-bot
#   journalctl --user -u opencode-bot -n 20 --no-pager | grep "token source"
#
# Remove (back to .env): delete credential.conf, daemon-reload, restart.

[Service]
# Choose ONE of the two lines below. The credential name MUST stay
# "telegram-bot-token": the bot looks for $CREDENTIALS_DIRECTORY/telegram-bot-token.

# A) Encrypted at rest (needs systemd >= 256 for per-user keys: `systemctl --version`).
LoadCredentialEncrypted=telegram-bot-token:%h/.config/opencode-bot/telegram-bot-token.cred

# B) Plain file (any systemd with user credentials). The file is chmod 600 and
#    lives outside the repo. Comment out A and use this instead:
# LoadCredential=telegram-bot-token:%h/.config/opencode-bot/telegram-bot-token
